spring:
  application:
    name: ecotrack-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecotrack}
    username: ${SPRING_DATASOURCE_USERNAME:ecotrack}
    password: ${SPRING_DATASOURCE_PASSWORD:ecotrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  environment: ${APP_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: EcoTrack API
    environment: ${app.environment}
    version: ${APP_VERSION:dev}

logging:
  file:
    name: ${LOG_DIR:logs}/ecotrack-api.log
