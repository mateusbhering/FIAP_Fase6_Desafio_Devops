name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + testes (unitarios, web e integracao) + cobertura
        run: ./mvnw -B -ntp verify

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = falhas = erros = ignorados = 0
          linhas = []
          for arq in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              s = ET.parse(arq).getroot()
              t, f, e, i = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; falhas += f; erros += e; ignorados += i
              icone = "✅" if f + e == 0 else "❌"
              linhas.append(f"| {icone} | `{s.get('name').rsplit('.', 1)[-1]}` | {t} | {f + e} | {s.get('time')}s |")
          print("## Testes automatizados\n")
          print(f"**{total} testes** — {falhas + erros} falha(s), {ignorados} ignorado(s)\n")
          print("| | Suite | Testes | Falhas | Tempo |\n|---|---|---|---|---|")
          print("\n".join(linhas))
          PY
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import csv
          linhas = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          cob = sum(int(l["LINE_COVERED"]) for l in linhas)
          perd = sum(int(l["LINE_MISSED"]) for l in linhas)
          print(f"\n**Cobertura de linhas (JaCoCo):** {100 * cob / (cob + perd):.1f}%")
          PY

      - name: Publicar relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

      - name: Publicar artefato (jar)
        uses: actions/upload-artifact@v4
        with:
          name: ecotrack-api-jar
          path: target/ecotrack-api.jar
          retention-days: 7

  # ---------------------------------------------------------- Imagem
  docker-image:
    name: Build e push da imagem Docker
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nome.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Nome da imagem
        id: nome
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecotrack-api"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nome.outputs.image }}
            ${{ steps.nome.outputs.repo }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.nome.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- CD
  deploy-staging:
    name: Staging
    needs: docker-image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker-image.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Producao
    needs: [docker-image, deploy-staging]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker-image.outputs.image }}
    secrets: inherit
